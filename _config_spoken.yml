# This in an alternate config file to compile only `workgroups` folder to speed up the compilation 
# for spoken guidelines only. It should be removed once Spoken guidelines are merged to UD.
# Use: jekyll build --config _config_spoken.yml 

source:       .
destination:  ./_site
markdown:     kramdown
highlighter:  rouge
# don't change the following; coderay will break the embedded
# annotations.
kramdown:
  enable_coderay: false
#   parse_block_html: true # allow markdown in <div> etc.
permalink:    date
# safe:         true
markdown_ext: md

baseurl: ""

# Exclude all folder except `workgroups`   
